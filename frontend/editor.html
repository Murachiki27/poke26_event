<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SGB Editor</title>
  <link rel="stylesheet" href="/src/editor.css" />
</head>
<body>
  <header class="bar">
    <div class="group" id="tools" role="radiogroup" aria-label="ツール">
      <button data-tool="pen" class="on" title="ペン (P)">ペン</button>
      <button data-tool="fill" title="塗りつぶし (F)">塗りつぶし</button>
      <button data-tool="pick" title="スポイト (I)">スポイト</button>
      <button data-tool="select" title="範囲選択 (S)">範囲選択</button>
    </div>
    <div class="group" id="palette" role="radiogroup" aria-label="色 (1〜4キー)"></div>
    <div class="group">
      <button id="undo" title="Ctrl+Z">元に戻す</button>
      <button id="redo" title="Ctrl+Shift+Z">やり直す</button>
      <button id="clear">全消去</button>
    </div>
    <div class="group">
      <label>拡大 <select id="zoom">
        <option value="2">×2</option>
        <option value="3" selected>×3</option>
        <option value="4">×4</option>
        <option value="8">×8</option>
        <option value="16">×16</option>
      </select></label>
      <label><input type="checkbox" id="grid" checked /> グリッド</label>
    </div>
    <div class="group">
      <button id="load">開く…</button>
      <button id="save" class="primary">保存 (.sgb)</button>
      <input type="file" id="file" accept=".sgb" hidden />
    </div>
  </header>

  <main class="stage" id="stage">
    <div class="board" id="board">
      <canvas id="canvas" width="256" height="256"></canvas>
      <canvas id="overlay"></canvas>
      <div id="selbox" hidden></div>
    </div>
  </main>

  <footer class="status" role="status" id="status">256×256 / 2bit / 16384 bytes</footer>
  <script type="module" src="/src/editor.js"></script>
</body>
</html>
